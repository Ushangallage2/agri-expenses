[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # PGSSLMODE is typically "require" — not a secret, but it false-positives on
  # "require" / "required" / "requireAuth" all over the codebase.
  SECRETS_SCAN_OMIT_KEYS = "PGSSLMODE,PG_CA_CERT,DB_NAME,DB_HOST,DB_PORT"
  SECRETS_SCAN_OMIT_PATHS = ".env.example,.gitignore,docs/**,scripts/mysql-dump-to-postgres.py"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "bcryptjs", "jsonwebtoken"]

# Daily check; weekly sends on Monday, monthly on the 1st (UTC).
# Keep this off sendLedgerSummary — scheduled + public HTTP is 403 in the browser.
[functions."sendLedgerSummaryCron"]
  schedule = "0 8 * * *"

# Free warm ping — keep DB pool / function runtime from going fully cold.
# Must be a dedicated function (not getDashboardBootstrap / getFertilizerBootstrap):
# scheduled + public HTTP on the same function often yields 403 in the browser.
[functions."warmApis"]
  schedule = "*/8 * * * *"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  framework = "vite"
