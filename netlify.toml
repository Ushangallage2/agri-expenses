[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # PGSSLMODE is typically "require" — not a secret, but it false-positives on
  # "require" / "required" / "requireAuth" all over the codebase.
  SECRETS_SCAN_OMIT_KEYS = "PGSSLMODE,PG_CA_CERT"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mysql2", "bcryptjs", "jsonwebtoken"]

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  framework = "vite"
