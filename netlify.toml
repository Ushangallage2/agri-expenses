[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mysql2", "bcryptjs", "jsonwebtoken"]

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  framework = "vite"
